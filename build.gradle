plugins {
    id 'java'
    id 'application'
}

group = 'br.ufc.qx'
version = '1.0-SNAPSHOT'

// Fixa a versão do Java usada para compilar e executar o projeto,
// independente do JDK que o aluno tenha como padrão na máquina.
// Se o aluno não tiver o JDK 21 instalado, o Gradle baixa automaticamente
// (graças ao plugin foojay-resolver-convention em settings.gradle).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'Runner'
}

test {
    useJUnitPlatform()
}
